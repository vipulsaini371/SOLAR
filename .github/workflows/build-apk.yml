name: Build Android APK

on:
  workflow_dispatch:          # Actions tab -> "Build Android APK" -> Run workflow
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm ci
      - name: Read app.config.json (fails with a clear message if the address is not set)
        run: node scripts/configure.js
      - name: Push notifications (added only when google-services.json is in the repository)
        run: |
          if [ -f google-services.json ]; then npm install @capacitor/push-notifications@^8; else echo "No google-services.json: building without push notifications"; fi
      - run: npx cap add android
      - name: Notification icon and Firebase files
        run: node scripts/patch-android.js
      - name: App icon + splash screen (from the pictures in /assets)
        run: npx capacitor-assets generate --android
      - name: Version number (goes up on every build so phones accept it as an update)
        run: |
          VN=$(node -p "require('./app.config.json').versionName || '1.0'")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: Sign (only when a release keystore is stored in the repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out dist/store-app.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify dist/store-app.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/store-app-TEST-ONLY.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
